function validHouse(u,c){return typeof u==='string'&&/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)&&typeof c==='string'&&c.length>0&&c.length<=256;}
function connectHouse(u,c,adopt,room=false){
  S.sy={u,c,since:0,init:false,adopt,room};S.fb={};S.ts={};
  gst.ok=null;gst.waiting=false;gst.at=0;
  save();sheet={kind:'household'};paintLayer();gsync();
}
async function startMenu(){
  const form=sheet;
  if(form?.kind!=='onboarding'||form.busy)return;
  const pair=form.mode==='pair';
  const m=document.getElementById('start-name')?.value.trim().slice(0,40);
  const d=document.getElementById('start-partner')?.value.trim().slice(0,40);
  form.names={m,d};
  form.settings=document.querySelector('#sheet details')?.open;
  const goals=['m',...(pair?['d']:[])].map(k=>[k,document.getElementById('start-kcal-'+k)]);
  form.goals=Object.fromEntries(goals.map(([k,input])=>[k,input?.value||'']));
  form.filters=Object.fromEntries([...document.querySelectorAll('[data-start-exclude]:checked')].map(el=>[el.dataset.startExclude,1]));
  if(!m||(pair&&!d)){showToast('Введите '+(pair?'оба имени':'имя'),false);paintLayer();return;}
  if(goals.some(([,input])=>input&&!input.validity.valid)){showToast('Укажите целое число от 800 ккал или оставьте поле пустым',false);paintLayer();return;}
  const names=pair?{m,d}:{m};
  const norms={...S.norms};
  for(const [k,value] of Object.entries(form.goals))if(value)norms[k]=Number(value);
  const draft={...S,me:'m',people:pair?2:1,names,norms,excluded:form.filters};
  if(!S.me||JSON.stringify(S.excluded)!==JSON.stringify(draft.excluded)||Object.values(form.goals).some(Boolean)){
    const previous=S;let plan;
    try{S={...draft,lock:{}};plan=generate();}finally{S=previous;}
    if(!plan){showToast('С такими исключениями меню не собрать. Разрешите ещё одну категорию.',false);paintLayer();return;}
    Object.assign(draft,plan,{lock:{},chk:{}});
  }
  if(!pair||!S.hub){
    S=draft;save();sheet=null;render();return;
  }
  if(S.sy)return;
  form.names=names;form.busy=true;paintLayer();
  try{
    const {u,c:beta}=S.hub;
    form.token??=Array.from(crypto.getRandomValues(new Uint8Array(32)),x=>x.toString(16).padStart(2,'0')).join('');
    const c=form.token;
    const snapshot=flat(draft);
    const set=Object.entries(snapshot).map(([k,v])=>({k,v}));
    const response=await gcall({u},{action:'create',c,beta,u:'m',set});
    if(!response?.ok)throw new Error(response?.error||'storage');
    if(sheet!==form)return;
    S=draft;
    connectHouse(u,c,true,true);render();
  }catch(e){
    if(sheet===form)showToast(e.message==='capacity'?'Лимит тестовых семей исчерпан':'Не получилось создать план. Проверьте связь и повторите.',false);
  }finally{
    form.busy=false;if(sheet===form)paintLayer();
  }
}
function importBeta(){
  try{
    const m=/^#h=(.+)$/.exec(location.hash);
    if(!m)return;
    const o=JSON.parse(atob(m[1]));
    if(validHouse(o.u,o.c)&&/^[a-f0-9]{64}$/.test(o.c)){
      S.hub={u:o.u,c:o.c};save();
      history.replaceState(null,'',location.pathname+location.search);
      return true;
    }
  }catch(e){}
}
async function readJoinInput(){
  const form=sheet;
  if(form?.kind!=='joinlink'||form.busy)return;
  const field=document.getElementById('join-link');
  const value=field.value.trim();
  const error=document.getElementById('join-error');
  error.textContent='';
  const me=document.getElementById('join-person').value;
  let invite;
  try{invite=readSyncInvite(new URL(value).hash);}catch(e){}
  if(invite){sheet={kind:'inviteconfirm',invite};paintLayer();return;}
  if(!/^[A-Za-z0-9_-]{22}$/.test(value)){
    error.textContent='Введите код общего плана или вставьте приглашение';return;
  }
  const button=document.querySelector('[data-act="readjoin"]');
  form.busy=true;button.disabled=true;button.textContent='Проверяю…';
  try{
    const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value));
    const c=Array.from(new Uint8Array(digest),byte=>byte.toString(16).padStart(2,'0')).join('');
    const u="https://script.google.com/macros/s/AKfycbzY1YdiktS017fbUgDeJMtreCDZgSLFpOr1Gm8usUuCuS0AzuFHEDuRKKdBdAvocZ5gJg/exec";
    const response=await gcall({u,c,room:true});
    if(sheet!==form)return;
    if(response?.error==='access'){error.textContent='Код не подошёл. Проверьте его и попробуйте снова.';return;}
    if(!response?.ok||!response.rows?.some(row=>row.k==='cook'&&!row.d))throw new Error('plan');
    sheet={kind:'inviteconfirm',invite:{u,c,me,room:true}};paintLayer();
  }catch(e){
    if(sheet===form)error.textContent='Не удалось проверить код. Проверьте интернет и повторите.';
  }finally{
    form.busy=false;button.disabled=false;button.textContent='Войти';
  }
}
function readSyncInvite(hash){
  try{
    const m=/^#s=(.+)$/.exec(hash);
    if(!m)return;
    const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if(o&&validHouse(o.u,o.c)&&['m','d'].includes(o.me)&&(!o.room||/^[a-f0-9]{64}$/.test(o.c)))return o;
  }catch(e){}
}
function importSync(){
  const invite=readSyncInvite(location.hash);
  if(!invite)return;
  sheet={kind:'inviteconfirm',invite};
  history.replaceState(null,'',location.pathname+location.search);
  return true;
}
