<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F3F1EA"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Заготовка"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png"><title>Заготовка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Концепция: прилавок рынка. Насыщенные «ящики» цвета, белые тарелки сверху, плотная широкая гарнитура для цифр. */
:root{
  --bg:#F3F1EA; --card:#FFFFFF; --ink:#10261A; --mut:#56695B; --line:#DAD8CC; --soft:#E9E7DD;
  --tomato:#FF5A3C; --lemon:#FFC93C; --leaf:#34C77B; --sea:#6C9CFF; --coral:#FF7E8B; --plum:#9B6BFF; --orange:#FF8A3D; --sand:#F2B84B;
  --dock:#10261A; --dockfg:#F3F1EA; --paint-ink:#10261A; --shadow:0 10px 30px -12px rgba(16,38,26,.35);
  --disp:'Unbounded','Onest',system-ui,sans-serif; --body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(0.23,1,0.32,1); --spring:cubic-bezier(0.34,1.56,0.64,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1510;--card:#16231B;--ink:#F3F1EA;--mut:#9DB2A2;--line:#27382D;--soft:#1E2E24;--dock:#F3F1EA;--dockfg:#10261A;--shadow:0 10px 30px -12px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1510;--card:#16231B;--ink:#F3F1EA;--mut:#9DB2A2;--line:#27382D;--soft:#1E2E24;--dock:#F3F1EA;--dockfg:#10261A;--shadow:0 10px 30px -12px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font-family:inherit;cursor:pointer;color:inherit;border:0;background:none;padding:0;transition:transform 160ms var(--ease),background-color 160ms var(--ease),opacity 160ms var(--ease)}
button:active{transform:scale(.95)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
input{font-family:inherit;color:var(--ink)}
#app{max-width:520px;margin:0 auto;padding-bottom:120px;min-height:100dvh;overflow-x:clip}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:700;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.num{font-family:var(--disp);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.mut{color:var(--mut)}
.small{font-size:13px}
/* top bar */
.bar{position:sticky;top:0;z-index:20;margin-inline:-16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);min-height:56px}
.bar .t{font-family:var(--disp);font-weight:700;font-size:15px;opacity:0;transform:translateY(6px)}
@supports (animation-timeline:scroll()){.bar .t{animation:barT linear both;animation-timeline:scroll(root);animation-range:60px 120px}@keyframes barT{to{opacity:1;transform:none}}}
.hero-h{padding:6px 0 4px}
.hero-h h1{font-size:30px}
.hero-h p{margin:6px 0 0;color:var(--mut);font-size:14px}
.rb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:0 1px 0 var(--line);flex:none}
.rb svg,.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rb.on{background:var(--tomato);color:#fff}
.rb.paint{color:var(--paint-ink)}
.rb:disabled{opacity:.35}
/* bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:14px}
.bx{border-radius:24px;padding:14px 16px;color:var(--paint-ink);position:relative;overflow:hidden;min-height:96px}
.bx .l{font-size:12px;font-weight:600;opacity:.8}
.bx .v{font-family:var(--disp);font-weight:700;font-size:26px;margin-top:6px;letter-spacing:-.03em}
.bx .v small{font-size:13px;font-weight:600;letter-spacing:0;margin-left:3px}
.bx .s{font-size:12px;margin-top:4px;opacity:.85}
.b-a{grid-column:span 4;background:var(--lemon)}.b-b{grid-column:span 2;background:var(--leaf)}.b-c{grid-column:span 3;background:var(--coral)}.b-d{grid-column:span 3;background:var(--sea);color:#fff}
.bx.sea{color:#06142E}
.ring{position:absolute;right:12px;top:12px;width:56px;height:56px}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .tr{stroke:rgba(16,38,26,.15)}.ring .pg{stroke:var(--paint-ink);transition:stroke-dashoffset 900ms var(--ease)}
.warn{margin-top:10px;padding:12px 14px;border-radius:18px;background:#FFE9B0;color:#4D3A00;font-size:13px;line-height:1.4;font-weight:500}
.warn.bad{background:#FFD2C9;color:#6E1708}
/* day cards */
.days{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.dc{border-radius:28px;padding:16px;color:var(--paint-ink);text-align:left;width:100%;display:grid;grid-template-columns:1fr auto;gap:10px 8px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.dc .dn{font-family:var(--disp);font-weight:700;font-size:40px;line-height:1;letter-spacing:-.04em}
.dc .dd{font-size:13px;font-weight:600;margin-top:4px;opacity:.85}
.dc .pl{display:flex;justify-content:flex-end;padding-right:6px}
.dc .pl .pt{width:60px;height:60px;margin-right:-18px;border-radius:50%;filter:drop-shadow(0 6px 8px rgba(16,38,26,.25));transition:transform 320ms var(--spring)}
.dc:hover .pt:nth-child(1){transform:translateY(-3px) rotate(-6deg)}
.dc .nm{grid-column:1/-1;font-size:13.5px;line-height:1.35;font-weight:500}
.dc .nm b{font-weight:700}
.dc .kc{grid-column:1/-1;justify-self:end;font-size:12px;font-weight:700;background:rgba(255,255,255,.55);border-radius:99px;padding:4px 10px}
.dc.sea{color:#06142E}
.dc.free{background:var(--soft);color:var(--ink);box-shadow:none}
.act-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{height:48px;border-radius:24px;padding:0 20px;font-weight:700;font-size:15px;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;gap:8px}
.btn.alt{background:var(--soft);color:var(--ink)}
.warn .btn.alt{background:var(--card)}
.btn.red{background:var(--tomato);color:#fff}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* day view */
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pager .mid{text-align:center;min-width:0}
.pager h1{font-size:22px}
.strip{display:flex;gap:6px;margin-top:10px;justify-content:center}
.strip button{width:44px;height:52px;border-radius:16px;background:var(--card);font-size:11px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.strip button b{font-family:var(--disp);font-size:15px;color:var(--ink)}
.strip button.on{background:var(--ink);color:var(--bg)}.strip button.on b{color:var(--bg)}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;background:var(--soft);border-radius:20px;margin-top:14px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:16px;background:var(--ink);transition:transform 320ms var(--ease);z-index:0}
.seg button{position:relative;z-index:1;height:42px;font-weight:700;font-size:14px;color:var(--mut);transition:color 200ms var(--ease)}
.seg button.on{color:var(--bg)}
.seg button:disabled{opacity:.35}
.stage{position:relative;height:250px;border-radius:32px;margin-top:14px;overflow:hidden;color:var(--paint-ink);box-shadow:var(--shadow);touch-action:pan-y}
.stage .pt{position:absolute;border-radius:50%;filter:drop-shadow(0 12px 14px rgba(16,38,26,.28));animation:plate 560ms var(--spring) both}
.stage .p1{width:164px;height:164px;left:-12px;top:84px;animation-delay:40ms}
.stage .p2{width:104px;height:104px;right:34px;top:8px;animation-delay:120ms}
.stage .p3{width:112px;height:112px;right:-6px;bottom:6px;animation-delay:200ms}
.stage.one .p1{width:200px;height:200px;left:auto;right:16px;top:25px;margin:0}
.stage .k{position:absolute;left:18px;top:16px}
.stage .k .num{font-size:40px;line-height:1}
.stage .k div:last-child{font-size:12px;font-weight:700;opacity:.8;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;border-radius:99px;padding:0 12px;font-size:12.5px;font-weight:700;background:var(--soft)}
.chip.ok{background:#CDEFD9;color:#0B4B26}.chip.warn{background:#FFE9B0;color:#4D3A00}
.rows{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:24px;padding:10px;animation:rise 420ms var(--ease) both}
.row .th{width:64px;height:64px;border-radius:20px;flex:none;display:grid;place-items:center}
.row .th .pt{width:54px;height:54px}
.row .tx{flex:1;min-width:0;text-align:left;padding:2px 0}
.row .tx .k{font-size:11.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.row .tx .n{font-weight:700;font-size:15.5px;line-height:1.2;margin-top:2px}
.row .tx .m{font-size:12.5px;color:var(--mut);margin-top:3px}
.row .ac{display:flex;gap:6px}
.heart svg{transition:transform 260ms var(--spring),fill 160ms}
.heart.on{color:var(--tomato)}.heart.on svg{fill:currentColor;animation:pop 420ms var(--spring)}
.swapb{background:var(--tomato);color:#fff}
.swapb svg{transition:transform 500ms var(--ease)}.swapb:active svg{transform:rotate(180deg)}
.free-card{margin-top:14px;border-radius:32px;padding:24px;background:var(--lemon);color:var(--paint-ink);position:relative;overflow:hidden;min-height:180px;box-shadow:var(--shadow)}
.free-card h2{font-size:24px;max-width:70%}
.free-card p{max-width:72%;font-size:14px;line-height:1.4;font-weight:500}
.free-card svg{position:absolute;right:-20px;bottom:-24px;width:190px;height:190px;animation:plate 700ms var(--spring) both}
/* shop */
.prog{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--leaf),var(--lemon));transition:width 600ms var(--ease)}
.sechd{display:flex;align-items:center;gap:8px;margin:22px 0 8px;font-family:var(--disp);font-weight:700;font-size:14px}
.sechd i{width:12px;height:12px;border-radius:4px}
.sg{background:var(--card);border-radius:24px;overflow:hidden}
.si{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;min-height:60px;border-bottom:1px solid var(--line)}
.sg > div:last-child .si{border-bottom:0}
.si .ico{width:40px;height:40px;border-radius:14px;flex:none;display:grid;place-items:center;color:var(--paint-ink);font-family:var(--disp);font-weight:700;font-size:15px}
.si .t{flex:1;min-width:0;text-align:left;padding:4px 0}
.si .a{font-weight:600;font-size:15px;transition:color 200ms}
.si .b{font-size:12.5px;color:var(--mut);margin-top:1px}
.si.done .a{color:var(--mut);text-decoration:line-through;text-decoration-thickness:2px}
.si.done .ico{opacity:.45;filter:grayscale(.6)}
.cb{width:44px;height:44px;display:grid;place-items:center;flex:none}
.cb i{width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;transition:background-color 200ms var(--ease),border-color 200ms var(--ease),transform 300ms var(--spring)}
.cb svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset 300ms var(--ease) 60ms}
.cb.on i{background:var(--leaf);border-color:var(--leaf);transform:scale(1.08)}
.cb.on svg{stroke-dashoffset:0}
.ext{padding:2px 14px 16px 60px;font-size:13px;color:var(--mut);animation:rise 300ms var(--ease) both}
.ext .al{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.ext .al div{background:var(--soft);border-radius:14px;padding:9px 11px;color:var(--ink);line-height:1.35}
.ext label{display:block;margin-top:10px;font-weight:700;color:var(--ink)}
input[type=text],input[type=search],input[type=number]{width:100%;height:46px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;margin-top:4px}
/* library */
.srch{position:relative;margin-top:10px}
.srch svg{position:absolute;left:14px;top:13px;width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round}
.srch input{padding-left:42px;margin:0}
.pills{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:12px 16px 4px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;height:40px;border-radius:99px;padding:0 16px;font-weight:700;font-size:14px;background:var(--card);color:var(--mut);scroll-snap-align:start}
.pills button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{position:relative;text-align:left;animation:rise 460ms var(--ease) both}
.tile .im{aspect-ratio:1;border-radius:28px;display:grid;place-items:center;overflow:hidden}
.tile .im .pt{width:84%;height:84%;transition:transform 500ms var(--spring);filter:drop-shadow(0 10px 10px rgba(16,38,26,.22))}
.tile:hover .im .pt{transform:rotate(14deg) scale(1.04)}
.tile .n{font-weight:700;font-size:14px;line-height:1.22;margin-top:8px}
.tile .m{font-size:12px;color:var(--mut);margin-top:2px}
.tile .heart{position:absolute;right:6px;top:6px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center;color:var(--paint-ink)}
.tile .heart.on{color:var(--tomato)}
.tile .heart svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round}
/* dock */
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:25;display:flex;gap:2px;padding:6px;border-radius:30px;background:var(--dock);color:var(--dockfg);box-shadow:0 18px 40px -12px rgba(0,0,0,.5);width:min(calc(100vw - 32px),420px)}
.dock button{flex:1;height:52px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:13px;position:relative;opacity:.7}
.dock button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dock button span{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;transition:max-width 340ms var(--ease),opacity 240ms var(--ease)}
.dock button.on{opacity:1;background:var(--lemon);color:#10261A;flex:1.9}
.dock button.on span{max-width:90px;opacity:1}
.dock .bd{position:absolute;top:6px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--tomato);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
/* sheets */
.shade{position:fixed;inset:0;background:rgba(8,20,13,.5);z-index:40;animation:fade 240ms var(--ease) both;backdrop-filter:blur(3px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;background:var(--bg);border-radius:32px 32px 0 0;max-height:92dvh;display:flex;flex-direction:column;animation:sheetIn 460ms var(--ease) both;padding-bottom:env(safe-area-inset-bottom,0px);will-change:transform;touch-action:pan-x}
.sheet.leaving{animation:sheetOut 260ms var(--ease) both}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0;flex:none}
.sheet .hd{padding:10px 20px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex:none;touch-action:none}
.sheet .bd{overflow:auto;padding:0 20px 28px;overscroll-behavior:contain;touch-action:pan-y}
.hero-i{border-radius:28px;display:grid;place-items:center;height:220px;margin-top:6px;position:relative;overflow:hidden}
.hero-i .pt{width:200px;height:200px;filter:drop-shadow(0 14px 16px rgba(16,38,26,.3));animation:plate 640ms var(--spring) both}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.kv div{background:var(--card);border-radius:18px;padding:10px 4px;text-align:center;font-size:11.5px;color:var(--mut)}
.kv b{display:block;font-family:var(--disp);font-size:17px;color:var(--ink);margin-bottom:2px}
.sec{font-family:var(--disp);font-weight:700;font-size:13px;margin:22px 0 8px}
table.ing{width:100%;border-collapse:collapse;font-size:14px}
table.ing td{padding:9px 0;border-bottom:1px solid var(--line)}
table.ing td:last-child{text-align:right;color:var(--mut);white-space:nowrap}
.dsel{display:flex;gap:6px;flex-wrap:wrap}
.dsel button{height:44px;min-width:50px;border-radius:16px;background:var(--card);font-weight:700}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border-radius:22px;padding:10px;margin-top:8px;animation:rise 420ms var(--ease) both}
.opt .th{width:60px;height:60px;border-radius:18px;flex:none;display:grid;place-items:center}
.opt .th .pt{width:50px;height:50px}
.opt .n{font-weight:700;font-size:15px;line-height:1.2}
.opt .m{font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.35}
.opt .dl{font-weight:700}
.up{color:#B3341C}.dn2{color:#14733F}
/* cooking */
.cook{position:fixed;inset:0;z-index:50;background:var(--paint);color:var(--paint-ink);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:fade 300ms var(--ease) both;touch-action:pan-y}
.cook .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cook .dots{display:flex;gap:5px;flex:1;margin:0 14px}
.cook .dots i{height:6px;flex:1;border-radius:3px;background:rgba(16,38,26,.2);transition:background-color 300ms var(--ease)}
.cook .dots i.d{background:var(--paint-ink)}
.cook .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;overflow:hidden}
.cook .big{font-family:var(--disp);font-size:clamp(22px,6.4vw,30px);font-weight:700;line-height:1.18;letter-spacing:-.02em}
.cook .stepn{font-family:var(--disp);font-weight:700;font-size:96px;line-height:.9;opacity:.9}
.cook .cp{animation:slideIn 420ms var(--ease) both}
.cook .cp.back{animation-name:slideInL}
.tm{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.55);border-radius:28px;padding:12px 16px;align-self:flex-start}
.tm .tr{width:64px;height:64px;position:relative}
.tm .tr svg{width:64px;height:64px;transform:rotate(-90deg)}
.tm .tr circle{fill:none;stroke-width:8;stroke-linecap:round}
.tm .tr .bg{stroke:rgba(16,38,26,.15)}.tm .tr .fg{stroke:var(--paint-ink)}
.tm .tt{font-family:var(--disp);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.cook .nav{display:flex;gap:10px}
.cook .nav .btn{flex:1;justify-content:center;background:var(--paint-ink);color:#fff}
.cook .nav .btn.alt{background:rgba(255,255,255,.55);color:var(--paint-ink);flex:none;width:64px;padding:0}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:20px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;width:max-content;max-width:min(440px,calc(100vw - 32px));animation:toastIn 420ms var(--spring) both}
.toast button{background:rgba(127,127,127,.3);border-radius:14px;height:36px;padding:0 14px;font-weight:700}
.empty{padding:36px 10px;text-align:center;color:var(--mut)}
.pt{display:block}.sv{width:100%;height:100%;display:block}
button.pt{padding:0}
.noanim .stage .pt{animation:none}

/* вся неделя */
.wg{display:grid;grid-template-columns:40px repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.gh{font-size:11px;font-weight:700;color:var(--mut);text-align:center;padding:2px 0}
.gd{border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--paint-ink);min-height:112px}
.gd b{font-family:var(--disp);font-size:15px}.gd span{font-size:11px;font-weight:700;opacity:.8}
.gc{position:relative;border-radius:18px;color:var(--paint-ink);min-height:112px;overflow:hidden}
.gc.free{background:var(--soft);display:grid;place-items:center;color:var(--mut);font-size:12px;font-weight:600}
.gb{display:block;width:100%;height:100%;text-align:left;padding:8px 6px 8px 8px}
.gp{position:relative;width:46px;height:46px}
.gp>.pt{width:46px;height:46px;filter:drop-shadow(0 3px 4px rgba(16,38,26,.25))}
.gs{position:absolute;right:-18px;bottom:-2px;width:26px;height:26px;display:block;filter:drop-shadow(0 2px 3px rgba(16,38,26,.3))}.gs.g2{right:-32px;bottom:18px;width:24px;height:24px}.gs .pt{width:100%;height:100%}
.gs .sv{width:100%;height:100%}
.gn{font-size:11px;font-weight:700;line-height:1.2;margin-top:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;hyphens:auto}
.gk{font-size:10.5px;font-weight:600;opacity:.8;margin-top:2px}
.gl{position:absolute;right:2px;top:2px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.55)}
.gl::after{content:"";position:absolute;inset:-7px}
.gl.on{background:var(--paint-ink);color:#fff}
@keyframes wob{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg) scale(1.03)}}
.snd{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.snd button{height:40px;border-radius:99px;padding:0 14px;background:var(--card);font-weight:700;font-size:13px;color:var(--ink)}.snd button.on{background:var(--ink);color:var(--bg)}

.stars{display:flex;gap:2px;margin:6px 0 2px}.stars button{width:44px;height:44px;border-radius:14px;font-size:27px;line-height:1;color:var(--mut);opacity:.45;transition:transform 240ms var(--spring),color 160ms,opacity 160ms}
.stars button.on{color:#FFB400;opacity:1}.stars button:active{transform:scale(1.25)}
.rbox{margin-top:14px;padding:12px 14px;border-radius:18px;background:var(--soft)}
.nev{display:inline-flex;align-items:center;height:36px;margin-top:8px;padding:0 14px;border-radius:99px;font-size:13px;font-weight:700;background:var(--card);color:var(--mut)}.nev.on{background:var(--ink);color:var(--bg)}
.rv{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--soft)}.rv .th{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;flex:none}.rv .th .pt{width:46px;height:46px}.rv .n{font-weight:700;font-size:15px;line-height:1.25}
.rtg{margin-left:6px;font-size:12px;font-weight:700;color:#C98A00}
.hist{margin-top:10px;font-size:13px;line-height:1.45;color:var(--mut)}.hist div{padding:8px 0;border-top:1px solid var(--soft)}.hist b{color:var(--ink)}

.mps{margin-top:18px}.mph{display:flex;align-items:center;gap:10px;margin-bottom:6px}.mph i{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--card);font-style:normal;font-weight:800;display:grid;place-items:center;font-size:13px;flex:none}.mph b{display:block;font-size:16px}.mph span{font-size:12px;color:var(--mut)}.mph em{margin-left:auto;font-style:normal;font-weight:700;font-size:13px;color:var(--mut);white-space:nowrap}
.mpi{display:flex;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:var(--soft);margin-top:6px;font-size:14px;line-height:1.4;color:var(--ink)}.mpi .cbx{width:22px;height:22px;border-radius:7px;border:2px solid var(--mut);flex:none;margin-top:1px}.mpi.on{opacity:.55}.mpi.on .cbx{background:var(--tomato);border-color:var(--tomato)}
.lbl{padding:8px 12px;border-radius:12px;background:var(--soft);margin-top:6px;font-size:14px}
.mpc{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:14px 16px;border-radius:22px;background:var(--tomato);color:#fff;text-align:left;line-height:1.3}.mpc small{opacity:.9;font-size:13px}.mpc .mpi2{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}.mpc svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.mpc>span:nth-child(2){flex:1}
.evc{margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--soft);font-size:14px;line-height:1.45}.evc ol{margin:6px 0 0;padding-left:20px}.evc li{margin-bottom:4px}
.ext .use{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--soft);border-radius:12px;padding:8px 11px;margin-top:6px;color:var(--ink);line-height:1.3}.ext .use span{color:var(--mut);font-size:12px;text-align:right}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes plate{from{opacity:0;transform:scale(.6) rotate(-24deg)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetOut{to{transform:translateY(100%)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,24px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes slideInL{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}
::view-transition-old(root),::view-transition-new(root){animation-duration:360ms;animation-timing-function:var(--ease)}
html[data-dir="f"]::view-transition-old(root){animation-name:vtOutL}html[data-dir="f"]::view-transition-new(root){animation-name:vtInR}
html[data-dir="b"]::view-transition-old(root){animation-name:vtOutR}html[data-dir="b"]::view-transition-new(root){animation-name:vtInL}
@keyframes vtOutL{to{opacity:0;transform:translateX(-14%)}}@keyframes vtInR{from{opacity:0;transform:translateX(14%)}}
@keyframes vtOutR{to{opacity:0;transform:translateX(14%)}}@keyframes vtInL{from{opacity:0;transform:translateX(-14%)}}
.noanim .row,.noanim .tile,.noanim .dc,.noanim .opt{animation:none}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}

function tone(c,t,o){const osc=c.createOscillator(),g=c.createGain();osc.type=o.type||'sawtooth';
  osc.frequency.setValueAtTime(o.f0,t);osc.frequency.exponentialRampToValueAtTime(o.f1,t+o.dur*(o.f2?.5:1));if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t+o.dur);
  if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=o.f0*.07;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+o.dur+.05);}
  let out=osc;if(o.lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;osc.connect(f);out=f;}
  out.connect(g);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.2,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+o.dur);g.connect(c.destination);osc.start(t);osc.stop(t+o.dur+.05);}

  h+='<div class="body"><div style="display:flex;align-items:center;gap:14px"><span class="pt" style="width:92px;height:92px;flex:none;filter:drop-shadow(0 8px 10px rgba(16,38,26,.28));animation:plate 600ms var(--spring) both">'+PAINT_ART.art(ck.id,REC)+'</span><div style="font-weight:700;opacity:.85;font-size:14px;line-height:1.25">'+esc(r.n)+'</div></div><div class="cp '+(ck.back?'back':'')+'" key="'+s+'"><div class="stepn">'+(s+1)+'</div><div class="big" style="margin-top:14px">'+esc(fq(st[s],r))+'</div></div>';
  if(ck.alarm){h+='<div class="tm"><div class="tt" style="animation:wob .6s ease-in-out infinite">Время!</div><button class="btn" style="height:44px;padding:0 18px;background:var(--paint-ink);color:#fff" data-act="alarmoff">Выключить</button></div>';}
  else if(m){const run=ck.timer&&ck.timer.step===s;h+='<div class="tm">'+'<div class="tr"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" id="tmc" cx="32" cy="32" r="26" stroke-dasharray="163.4" stroke-dashoffset="'+(run?163.4*(1-Math.max(0,(ck.timer.end-Date.now())/ck.timer.total)):163.4)+'"/></svg></div><div><div class="tt" id="tmt">'+(run?tfmt(ck.timer.end-Date.now()):m+':00')+'</div><button class="btn" style="height:38px;padding:0 14px;margin-top:4px;background:var(--paint-ink);color:#fff;font-size:13px" data-act="timer" data-v="'+m+'">'+(run?'Сбросить':'Запустить таймер')+'</button></div></div>';}
  h+='</div><div class="nav"><button class="btn alt" data-act="cprev" aria-label="Назад"'+(s===0?' disabled style="opacity:.4"':'')+'>'+IC.left+'</button><button class="btn" data-act="cnext">'+(s===n-1?'Готово':'Дальше')+'</button></div></div>';
  return h;
}
function stepMin(t){const m=/(\d+)(?:–(\d+))?\s*(?:минут|мин)/.exec(t);if(!m)return 0;return +(m[2]||m[1]);}
const tfmt=ms=>{ms=Math.max(0,Math.ceil(ms/1000));return Math.floor(ms/60)+':'+String(ms%60).padStart(2,'0');};
let tmI=null;
function tick(){
  if(!ck||!ck.timer){clearInterval(tmI);tmI=null;return;}
  const left=ck.timer.end-Date.now(),t=document.getElementById('tmt'),c=document.getElementById('tmc');
  if(t)t.textContent=tfmt(left);if(c)c.setAttribute('stroke-dashoffset',String(163.4*(1-Math.max(0,left/ck.timer.total))));
  if(left<=0){clearInterval(tmI);tmI=null;try{navigator.vibrate&&navigator.vibrate([200,100,200,100,200]);}catch(e){}ck.timer=null;ck.alarm=true;startAlarm();paintLayer();}
}
function toastHtml(){return toast?'<div class="toast" role="status"><span>'+esc(toast.msg)+'</span>'+(toast.undo?'<button data-act="undo">Отменить</button>':'')+'</div>':'';}
function showToast(msg,u){toast={msg,undo:u};clearTimeout(showToast.t);showToast.t=setTimeout(()=>{toast=null;paintLayer();},5000);}
function paintLayer(){
  const old=document.getElementById('sheet'),sc=old?old.querySelector('.bd').scrollTop:0,keep=!!old&&sheet&&sheet._shown;
  $layer.innerHTML=sheetHtml()+cookHtml()+toastHtml();
  if(sheet){sheet._shown=true;const n=document.getElementById('sheet');if(n&&keep){n.style.animation='none';n.querySelector('.bd').scrollTop=sc;const sh=$layer.querySelector('.shade');if(sh)sh.style.animation='none';}}
}
function closeSheet(){
  const s=document.getElementById('sheet'),sh=$layer.querySelector('.shade');
  if(!s||reduce){sheet=null;paintLayer();return;}
  s.style.transition='';s.style.transform='';s.classList.add('leaving');if(sh){sh.style.animation='none';sh.style.transition='opacity 240ms';sh.style.opacity='0';}
  setTimeout(()=>{sheet=null;paintLayer();},240);
}

/* ---------- рендер и переходы ---------- */
function render(){
  const y=window.scrollY;
  const html=(S.tab==='week'?viewWeek():S.tab==='day'?viewDay():S.tab==='shop'?viewShop():viewBook());
  $app.innerHTML=html+dockHtml();
  $app.classList.toggle('noanim',!enter);
  paintLayer();countUp();
  enter=false;
}
function countUp(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const id=el.dataset.id,to=+el.dataset.count,from=prevNum[id]!==undefined?prevNum[id]:0;prevNum[id]=to;
    if(from===to||reduce){el.textContent=fmt(to);return;}
    const t0=performance.now(),dur=700;
    const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
}
function go(fn,dir){
  if(document.startViewTransition&&!reduce){document.documentElement.dataset.dir=dir||'f';try{document.startViewTransition(()=>{fn();});return;}catch(e){}}
  fn();
}
function setTab(t){const a=TABS.indexOf(S.tab),b=TABS.indexOf(t);if(a===b)return;go(()=>{S.tab=t;enter=true;save();render();window.scrollTo(0,0);},b>a?'f':'b');}
function setDay(d,slot){const dir=d>=S.day?'f':'b';go(()=>{enter=true;S.day=d;if(slot)S.slot=slot;else if(d===0)S.slot='Ужин';else if(d===5&&S.slot==='Ужин')S.slot='Обед';save();render();},dir);}

/* ---------- генератор недели ---------- */
/* ---------- оценки и история ---------- */
const rt=i=>S.rate[REC[i].n]||0;
const banned=i=>!!S.ban[REC[i].n];
function weeksWith(n){const w=[];S.hist.forEach(h=>{if(h.bf.indexOf(n)>=0||h.cook.some(x=>x.m===n||x.s===n||x.l===n))w.push(h.w);});return w;}
const wkTxt=w=>{const d=new Date(w+'T12:00:00'),e=new Date(d);e.setDate(e.getDate()+5);return (d.getMonth()===e.getMonth()?d.getDate():d.getDate()+' '+MONTHS[d.getMonth()])+'–'+e.getDate()+' '+MONTHS[e.getMonth()];};
function recentNames(weeks){const s=new Set();if(weeks<=0)return s;S.hist.slice(-weeks).forEach(h=>{h.cook.forEach(x=>{s.add(x.m);s.add(x.s);s.add(x.l);});h.bf.forEach(b=>s.add(b));});return s;}
const winOf=t=>t==='Основное'?S.rep:t==='Салат'?Math.ceil(S.rep*.7):Math.ceil(S.rep/2);
function poolFor(type){
  const ids=ofType(type).filter(i=>!banned(i));
  for(let w=winOf(type);w>=0;w--){const rc=recentNames(w);const p=ids.filter(i=>!rc.has(REC[i].n));if(p.length>=8||w===0)return p.length>=5?p:ids;}
  return ids;
}
function weight(i){const r=rt(i);let w=r===0?1.5:[0.03,0.25,1,2,3][r-1];if(S.fav[i])w*=1.5;return w;}
const wsh=a=>a.map(v=>[-Math.log(Math.random())/weight(v),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const starsHtml=i=>{const v=rt(i);let h='<div class="stars" role="group" aria-label="Оценка блюда">';for(let n=1;n<=5;n++)h+='<button data-act="rate" data-v="'+i+'" data-s="'+n+'" class="'+(n<=v?'on':'')+'" aria-label="'+n+' из 5" aria-pressed="'+(n===v)+'">★</button>';return h+'</div>';};
const rtTag=i=>rt(i)?'<span class="rtg">★ '+rt(i)+'</span>':'';
let confirmClose=false,histOpen=false;
function closeWeek(){
  const nm=i=>REC[i].n,ids=[];
  const add=i=>{if(ids.indexOf(i)<0)ids.push(i);};
  S.cook.forEach(c=>{add(c.m);add(c.s);add(c.l);});S.bf.forEach(add);
  S.hist.push({w:S.wk,cook:S.cook.map(c=>({m:nm(c.m),s:nm(c.s),l:nm(c.l)})),bf:S.bf.map(nm)});
  if(S.hist.length>26)S.hist=S.hist.slice(-26);
  S.lock={};const g=generate();if(g){S.cook=g.cook;S.bf=g.bf;}S.chk={};
  const nx=new Date(S.wk+'T12:00:00');nx.setDate(nx.getDate()+7);const ws=iso(weekStart()),ni=iso(nx);S.wk=ni<ws?ws:ni;
  const todo=ids.filter(i=>!rt(i)&&!banned(i));
  save();
  if(todo.length){sheet={kind:'review',ids:todo,title:'Неделя закрыта',sub:'Оцените блюда'};}else showToast('Неделя закрыта, новая собрана',false);
  enter=true;render();window.scrollTo(0,0);
}

/* ---------- генератор недели ---------- */
function generate(){
  const mains=poolFor('Основное'),sides=poolFor('Гарнир'),sals=poolFor('Салат'),brs=poolFor('Завтрак');
  let best=null,bs=-1e9;
  const norm=(S.norms.m+S.norms.d)/2,L=S.lock||{};
  for(let t=0;t<300;t++){
    const m=wsh(mains).slice(0,5),s=wsh(sides).slice(0,5),l=wsh(sals).slice(0,5),b=wsh(brs).slice(0,5);
    const cook=[0,1,2,3,4].map(j=>L['c'+j]?S.cook[j]:{m:m[j],s:s[j],l:l[j]}),bf=[0,1,2,3,4].map(j=>L['b'+j]?S.bf[j]:b[j]);
    const cats={};cook.forEach(c=>cats[REC[c.m].c]=(cats[REC[c.m].c]||0)+1);
    if(Math.max(...Object.values(cats))>2)continue;
    if(!cook.some(c=>REC[c.m].c==='Рыба'||REC[c.m].c==='Морепродукты'))continue;
    const old=S;S=Object.assign({},old,{cook,bf});
    const cost=planCost(),sp=sundayPrep();let ev=0;for(let d=0;d<5;d++)ev+=Math.max(0,eveningMin(d)-30);
    let bev=0;bf.forEach(i=>{bev+=Math.max(0,REC[i].ev-15);});const avg=avgDay();
    S=old;
    const nov=Math.min(2,cook.filter(c=>!rt(c.m)).length)+Math.min(1,bf.filter(i=>!rt(i)).length);
    const sc=-Math.max(0,cost-BUDGET)/20-Math.max(0,sp-180)*5-ev*20-bev*20-Math.abs(avg-norm)/10+nov*12;
    if(sc>bs){bs=sc;best={cook,bf};}
  }
  return best;
}

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case 'tab':sheet=null;setTab(v);break;
    case 'openday':{const d=+v;go(()=>{S.day=d;S.tab='day';S.slot=d<=4?'Ужин':'Обед';enter=true;save();render();window.scrollTo(0,0);},'f');break;}
    case 'dprev':setDay(Math.max(0,S.day-1));break;
    case 'dnext':setDay(Math.min(5,S.day+1));break;
    case 'gotoday':setDay(+v);break;
    case 'slot':{const o=['Завтрак','Обед','Ужин'];const dir=o.indexOf(v)>=o.indexOf(S.slot)?'f':'b';go(()=>{enter=true;S.slot=v;save();render();},dir);break;}
    case 'fav':{const i=+v;if(S.fav[i])delete S.fav[i];else S.fav[i]=1;save();const sc=document.getElementById('sheet')?document.getElementById('sheet').querySelector('.bd').scrollTop:0;render();break;}
    case 'rate':{const n=REC[+v].n,s=+el.dataset.s;if(S.rate[n]===s)delete S.rate[n];else S.rate[n]=s;save();try{navigator.vibrate&&navigator.vibrate(8);}catch(e2){}render();break;}
    case 'ban':{const n=REC[+v].n;if(S.ban[n])delete S.ban[n];else{S.ban[n]=1;delete S.fav[+v];}save();render();break;}
    case 'closeweek':{if(!confirmClose){confirmClose=true;render();clearTimeout(closeWeek.t);closeWeek.t=setTimeout(()=>{confirmClose=false;if(!sheet)render();},5000);}else{confirmClose=false;closeWeek();}break;}
    case 'reps':S.rep=+v;save();render();break;
    case 'histopen':histOpen=!histOpen;render();break;
    case 'libmore':S.lib.n=(S.lib.n||60)+60;enter=false;save();render();break;
    case 'libf':S.lib.f=S.lib.f===v?'':v;enter=true;save();render();break;
    case 'wview':S.wview=v;save();enter=true;render();break;
    case 'scale':S.scale=S.scale===false;save();render();break;
    case 'lock':if(S.lock[v])delete S.lock[v];else S.lock[v]=1;save();render();break;
    case 'lockall':['b0','b1','b2','b3','b4','c0','c1','c2','c3','c4'].forEach(k=>S.lock[k]=1);save();render();break;
    case 'unlockall':S.lock={};save();render();break;
    case 'gopen':{const d=+el.dataset.d;go(()=>{S.day=d;S.tab='day';S.slot=v;enter=true;save();render();window.scrollTo(0,0);},'f');break;}
    case 'swap':swapQ={q:'',c:''};sheet={kind:'swap',role:v};paintLayer();break;
    case 'detail':sheet={kind:'detail',id:+v};paintLayer();break;
    case 'master':sheet={kind:'master'};paintLayer();break;
    case 'mpchk':{const dn=mpDone();if(dn[v])delete dn[v];else dn[v]=1;save();paintLayer();try{navigator.vibrate&&navigator.vibrate(8);}catch(e2){}break;}
    case 'close':closeSheet();break;
    case 'pick':{const ri=roleInfo(sheet.role),prev=ri.get();ri.set(+v);undo={role:sheet.role,prev};const nm=REC[+v].n;save();sheet=null;showToast('Заменено на «'+nm+'»',true);render();break;}
    case 'undo':if(undo){roleInfo(undo.role).set(undo.prev);undo=null;save();}toast=null;render();break;
    case 'place':{const i=sheet.id,r=REC[i],d=+v;if(r.t==='Завтрак')S.bf[d-1]=i;else S.cook[d][r.t==='Основное'?'m':r.t==='Гарнир'?'s':'l']=i;save();sheet=null;showToast('Поставлено на '+DN[d].toLowerCase(),false);render();break;}
    case 'regen':{const g=generate();if(g){go(()=>{S.cook=g.cook;S.bf=g.bf;S.chk={};enter=true;save();showToast('Неделя собрана заново',false);render();},'f');}break;}
    case 'reset':{const d=defaultState();go(()=>{S.cook=d.cook;S.bf=d.bf;S.chk={};S.lock={};enter=true;save();render();},'b');break;}
    case 'chk':if(S.chk[v])delete S.chk[v];else S.chk[v]=1;save();render();try{navigator.vibrate&&navigator.vibrate(8);}catch(e2){}break;
    case 'shopopen':shopOpen=shopOpen===v?null:v;render();break;
    case 'uncheck':S.chk={};save();render();break;
    case 'libt':S.lib.t=v;S.lib.c='';S.lib.n=60;enter=true;save();render();break;
    case 'libc':S.lib.c=v;enter=true;save();render();break;
    case 'libfav':S.lib.fav=!S.lib.fav;enter=true;save();render();break;
    case 'swapc':swapQ.c=v;paintLayer();break;
    case 'share':{const enc=btoa(unescape(encodeURIComponent(JSON.stringify(sharedLink()))));const url=location.href.split('#')[0]+'#p='+enc;
      const done=()=>{showToast('Ссылка с планом скопирована',false);paintLayer();};
      if(navigator.share){navigator.share({title:'План на неделю',url}).catch(()=>{});}
      else if(navigator.clipboard){navigator.clipboard.writeText(url).then(done).catch(()=>{prompt&&0;showToast('Не удалось скопировать',false);paintLayer();});}
      break;}
    case 'theme':{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;d.dataset.theme=dark?'light':'dark';break;}
    case 'cook':{ck={id:+v,step:0,timer:null};sheet=null;paintLayer();try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e2){}break;}
    case 'cookx':clearInterval(tmI);tmI=null;stopAlarm();ck=null;paintLayer();break;
    case 'alarmoff':stopAlarm();if(ck)ck.alarm=false;paintLayer();break;
    case 'snd':S.snd=v;save();if(v!=='off')preview(v);render();break;
    case 'cnext':{const n=REC[ck.id].st.length;if(ck.step>=n-1){clearInterval(tmI);tmI=null;const rid=ck.id;ck=null;if(!rt(rid)&&!banned(rid))sheet={kind:'review',ids:[rid],title:'Приятного аппетита',sub:'Как получилось?'};else showToast('Приятного аппетита',false);paintLayer();break;}stopAlarm();ck.alarm=false;ck.step++;ck.back=false;ck.timer=null;paintLayer();break;}
    case 'cprev':if(ck.step>0){stopAlarm();ck.alarm=false;ck.step--;ck.back=true;ck.timer=null;paintLayer();}break;
    case 'timer':{if(ck.timer&&ck.timer.step===ck.step){ck.timer=null;clearInterval(tmI);tmI=null;}else{ac();const ms=(+v)*60000;ck.timer={step:ck.step,end:Date.now()+ms,total:ms};clearInterval(tmI);tmI=setInterval(tick,250);}paintLayer();break;}
  }
});
document.addEventListener('input',e=>{
  const el=e.target,a=el.dataset&&el.dataset.act;if(!a)return;
  if(a==='libq'){S.lib.q=el.value;save();const p=el.selectionStart;enter=false;render();const n=document.getElementById('libq');if(n){n.focus();n.setSelectionRange(p,p);}}
  else if(a==='swapq'){swapQ.q=el.value;const p=el.selectionStart;paintLayer();const n=document.getElementById('swapq');if(n){n.focus();n.setSelectionRange(p,p);}}
  else if(a==='subtxt'){const t=el.value.trim();if(t)S.sub[el.dataset.v]=t;else delete S.sub[el.dataset.v];save();}
  else if(a==='price'){const x=+el.value;if(x>0)S.price[el.dataset.v]=x;else delete S.price[el.dataset.v];save();}
  else if(a==='homeg'){S.home[el.dataset.v]=Math.max(0,+el.value||0);save();}
  else if(a==='norm'){S.norms[el.dataset.v]=Math.max(800,+el.value||1800);save();}
});
document.addEventListener('change',e=>{const a=e.target.dataset&&e.target.dataset.act;if(a==='homeg'||a==='subtxt'||a==='norm'||a==='price'){enter=false;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ck){ck=null;paintLayer();}else if(sheet)closeSheet();}});

/* жесты: свайп по дням, перетягивание шторки вниз */
let sw=null;
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('input,button.rb,.pills'))return;
  const hd=e.target.closest('#shd,.grab');
  if(hd){const s=document.getElementById('sheet');sw={type:'sheet',x:e.clientX,y:e.clientY,s};try{hd.setPointerCapture(e.pointerId);}catch(_){}return;}
  if(S.tab==='day'&&!sheet&&!ck&&e.target.closest('#app')){sw={type:'day',x:e.clientX,y:e.clientY};}
  if(ck&&e.target.closest('#cook')&&!e.target.closest('button')){sw={type:'cook',x:e.clientX,y:e.clientY};}
});
document.addEventListener('pointermove',e=>{
  if(!sw||sw.type!=='sheet')return;
  const dy=Math.max(0,e.clientY-sw.y);sw.dy=dy;sw.s.style.animation='none';sw.s.style.transition='none';sw.s.style.transform='translateY('+dy+'px)';
});
function endSw(e){
  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y,t=sw.type,s=sw.s;sw=null;
  if(t==='sheet'){if(dy>110){closeSheet();}else if(s){s.style.transition='transform 360ms var(--spring)';s.style.transform='';}return;}
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){
    if(t==='day'){const d=S.day+(dx<0?1:-1);if(d>=0&&d<=5)setDay(d);}
    else if(t==='cook'&&ck){if(dx<0){const n=REC[ck.id].st.length;if(ck.step<n-1){ck.step++;ck.back=false;ck.timer=null;paintLayer();}}else if(ck.step>0){ck.step--;ck.back=true;ck.timer=null;paintLayer();}}
  }
}
document.addEventListener('pointerup',endSw);document.addEventListener('pointercancel',()=>{if(sw&&sw.s){sw.s.style.transition='transform 300ms var(--spring)';sw.s.style.transform='';}sw=null;});

(function importHash(){
  try{const m=/^#p=(.+)$/.exec(location.hash);if(!m)return;
    const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if(o&&o.cook&&o.bf){SH.forEach(k=>{if(o[k]!==undefined)S[k]=o[k];});save();history.replaceState(null,'',location.pathname+location.search);
      setTimeout(()=>{showToast('План из ссылки загружен',false);paintLayer();},300);}
  }catch(e){}
})();
window.__z={sundayPrep,blanksOf,masterPlan,fq,REC,gs:()=>S};
render();initSync();
})();
